# Same as example.conf, with paths for running from the repo root on your machine.
NAME="demo_worker"
COMMAND="python3 my_worker.py"
RESTART_POLICY="always"

MAX_CPU_PCT=90
CPU_SUSTAIN=30
MAX_MEM_MB=200
CHECK_INTERVAL=2
STOP_TIMEOUT=10
MAX_RESTART_DELAY=30
MIN_UPTIME=10

LOG_DIR="./logs"
LOG_RETENTION_DAYS=7
PID_DIR="/tmp/process-supervisor"
